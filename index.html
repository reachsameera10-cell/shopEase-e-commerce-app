<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfaf7" />
    <meta name="description" content="Shop quality products with a simple, secure checkout." />
    <title>ShopEase | Online Store</title>
    <script>
      (() => {
        let theme = 'light'
        try {
          const savedTheme = localStorage.getItem('shopease-theme')
          if (savedTheme === 'light' || savedTheme === 'dark') {
            theme = savedTheme
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark'
          }
        } catch (error) {
          console.error('Unable to read the saved theme preference.', error)
        }
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', theme === 'dark' ? '#151a17' : '#fbfaf7')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
